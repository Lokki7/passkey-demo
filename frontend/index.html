<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Passkey Demo</title>
  </head>
  <body>
    <div class="container">
      <h1>Passkey Demo</h1>
      <p>
        Simple WebAuthn demo. Use the same username for register
        and authenticate.
      </p>

      <label class="label">
        Username
        <input id="username" type="text" placeholder="alice" />
      </label>

      <div class="actions">
        <button id="register">Register passkey</button>
        <button id="login">Authenticate</button>
        <button id="login-usernameless">Authenticate (no username)</button>
      </div>

      <pre id="log" class="log"></pre>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
